- text: Segmenting the cells
  source: FF 2026-11-22, his own edit saved on the TGT decision page (slides 2-4)
- text: '• Input: IRM frames only (every 4th frame of TGT)'
  source: FF 2026-11-22, his own edit saved on the TGT decision page (slides 2-4)
- text: '• Model: Cellpose-SAM, pretrained, default settings'
  source: FF 2026-11-22, his own edit saved on the TGT decision page (slides 2-4)
- text: '• Three passes: full, half and quarter image size'
  source: FF 2026-11-22, his own edit saved on the TGT decision page (slides 2-4)
