- text: • Cells segmented in IRM channel using Cellpose-SAM at 3 spatial scales. Objects < 500 px removed.
  source: FF 2026-11-22, his own edit saved on the TGT decision page (slides 2-4)
- text: '• Left: IRM with outlines; right: TGT'
