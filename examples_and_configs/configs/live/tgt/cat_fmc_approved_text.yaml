- text: CAT and FMC CAR T Cells on 12 pN TGT Surfaces, September 2026
  source: 'FF 2026-11-23, relayed verbatim by TGT Sept EMCCD copy and first look: "the title of our main deck is super misleading as it only covers sept 2026"; to this exact wording: "Use that"'
- text: '• Cell: segmented object of 500 pixels or more, outlined on each IRM frame'
  source: 'FF 2026-11-23, relayed verbatim by TGT Sept EMCCD copy and first look, on the definitions slide body: "ok for now. rebuild main"'
- text: '• Under a cell: pixels inside that cell''s outline in that IRM frame'
  source: 'FF 2026-11-23, relayed verbatim by TGT Sept EMCCD copy and first look, on the definitions slide body: "ok for now. rebuild main"'
- text: '• Under cells, whole field: pixels inside a cell in every IRM frame of the movie'
  source: 'FF 2026-11-23, relayed verbatim by TGT Sept EMCCD copy and first look, on the definitions slide body: "ok for now. rebuild main"'
- text: '• Away from cells: pixels at least 0.5 μm from every object, of any size, in every IRM frame of the movie'
  source: 'FF 2026-11-23, relayed verbatim by TGT Sept EMCCD copy and first look, on the definitions slide body: "ok for now. rebuild main"'
- text: '• In neither group: pixels covered in only some frames; the 0.5 μm band around objects; objects under 500 pixels; the last 3 pixel columns'
  source: 'FF 2026-11-23, relayed verbatim by TGT Sept EMCCD copy and first look, on the definitions slide body: "ok for now. rebuild main"'
- text: '• Cells used: tracked through every IRM frame of the movie'
  source: 'FF 2026-11-23, relayed verbatim by TGT Sept EMCCD copy and first look, on the definitions slide body: "ok for now. rebuild main"'
- text: • Camera offset of 100 counts subtracted from all TGT values
  source: 'FF 2026-11-23, relayed verbatim by TGT Sept EMCCD copy and first look, on the definitions slide body: "ok for now. rebuild main"'
