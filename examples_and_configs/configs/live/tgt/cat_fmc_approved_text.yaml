# FF's edits of slides 2-4 on the TGT decision page, 2026-11-22 (two typo fixes: "; " in the Left/right line,
# "or less removed" for "or  lesremoved")
- text: 'Experiment and Imaging'
  source: &pageedit 'FF 2026-11-22, his own edit saved on the TGT decision page (slides 2-4)'
- text: '• 12 pN TGT'
  source: *pageedit
- text: '• Fields of view (FOVs): 86 on 20260923, 70 on 20260924 d4, 43 on 20260925 d5'
  source: *pageedit
- text: 'How movies will be displayed in this PPT'
  source: *pageedit
- text: '• Cells segmented in IRM channel using Cellpose-SAM at 3 spatial scales. Objects < 500 px removed.'
  source: *pageedit
- text: '• Left: IRM with outlines; right: TGT'
  source: *pageedit
- text: '• Only frames with IRM displayed: every 4th frame, up to 8 per movie, ~4 min apart; 2 frames/s'
  source: *pageedit
- text: 'Segmenting the cells'
  source: *pageedit
- text: '• Input: IRM frames only (every 4th frame of TGT)'
  source: *pageedit
- text: '• Model: Cellpose-SAM, pretrained, default settings'
  source: *pageedit
- text: '• Three passes: full, half and quarter image size'
  source: *pageedit
- text: '• The half- and quarter-size passes add only cells not already found (less than half overlap)'
  source: *pageedit
- text: '• Objects under 500 pixels in area (12.8 μm²) removed'
  source: 'FF 2026-11-22, chat via TGT Sept EMCCD copy and first look'
- text: '• Reference: Pachitariu M, Rariden M, Stringer C. Cellpose-SAM: superhuman generalization for cellular segmentation. bioRxiv 2025. doi:10.1101/2025.04.28.651001'
  source: *pageedit
- text: 'Brightness, fixed for each movie'
  source: &bright 'FF 2026-11-22, chat via TGT Sept EMCCD copy and first look'
- text: '• TGT: dimmest 1% of the first frame shown black'
  source: *bright
- text: '• TGT: brightest 0.1% of all frames in the movie shown white'
  source: *bright
- text: '• IRM: dimmest 0.1% black, brightest 0.1% white, all frames in the movie'
  source: *bright
- text: '• Compare brightness within a movie, not between movies'
  source: *bright
