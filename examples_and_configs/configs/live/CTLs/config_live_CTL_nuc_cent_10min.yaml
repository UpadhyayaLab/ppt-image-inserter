# Batch Image Replacement Configuration
# Live-cell CTL Nucleus/Centrosome — CD3_combined, 10 min window, 20260413
# Metrics mirror the Jurkat live-cell config (nucleus + centrosome + invagination subset).

presentation: "K:/FF/PPT/PPT_autogeneration/Live Cells/CTL Nucleus Centrosome Live_template.pptx"
output_path:  "K:/FF/PPT/PPT_autogeneration/Live Cells/CTL Nucleus Centrosome Live, 10min.pptx"

# Template slide must have four image placeholders (base / _norm / _all_cells / _0_vs_tend).
template_slide: 0
preserve_slides: [0]

auto_position: true
label_side: left

base_dir: "M:/Zach/Nucleus_Data_Live/CTL/CD3_combined/results_live_cells/nuc_cent_10min_20260413"

# Each slide = one metric, four panels:
#   1) <metric>.tif            (raw)
#   2) <metric>_norm.tif       (per-cell normalized)
#   3) <metric>_all_cells.tif  (all cells overlay)
#   4) <metric>_0_vs_tend.tif  (start vs end)

