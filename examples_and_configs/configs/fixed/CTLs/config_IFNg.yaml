# Config: CTL IFNg grid plots -- with nucleus channel
#
# Template slides (3 slides, 0-indexed):
#   0: 3-image comparison (timepoint and stiffness comparisons)
#   1: PLL vs Glass (1 image)
#   2: All conditions (1 image)
#
# Ordering: Metric -> Comparison type (140 slides: 35 metrics x 4 comparisons)
#
# Metrics (in order):
#   --- Cell/actin synapse (5) ---
#    1. actin_deform_ratio                                       -- Cell Aspect Ratio
#    2. actin_bottom_mask_area                                   -- Synapse Area
#    3. actin_bottom_MFI                                         -- Actin synapse MFI
#    4. actin_bottom_inner_outer_ratio                           -- Actin synapse inner/outer ratio
#    5. actin_bottom_circularity                                 -- Synapse Circularity
#   --- IFNg synapse (10) ---
#    6. IFNg_peak_sig                                            -- IFN-g peak signal
#    7. IFNg_total_sig                                           -- IFN-g total signal
#    8. IFNg_synapse_MFI                                         -- IFN-g synapse MFI
#    9. IFNg_synapse_MFI_3mip                                    -- IFN-g synapse MFI (3-MIP)
#   10. IFNg_synapse_inner_outer_ratio                           -- IFN-g synapse inner/outer ratio
#   11. IFNg_synapse_inner_outer_ratio_3mip                      -- IFN-g synapse inner/outer ratio (3-MIP)
#   12. IFNg_synapse_total_sig                                   -- IFN-g synapse total signal
#   13. IFNg_synapse_total_sig_3mip                              -- IFN-g synapse total signal (3-MIP)
#   14. IFNg_z50_cell_bottom_distance                            -- IFN-g z50 cell bottom distance
#   15. IFNg_z50_cell_bottom_distance_norm_cell_height           -- IFN-g z50 cell bottom distance (norm. cell height)
#   --- Nuclear shape & invagination (8) ---
#   16. nuc_aspect_ratio                                         -- Nuclear aspect ratio
#   17. nuc_volume_mesh                                          -- Nuclear volume
#   18. nuc_SA_mesh                                              -- Nuclear surface area
#   19. nuc_solidity                                             -- Nuclear solidity
#   20. chull_max_D                                              -- Max invag depth over full nucleus
#   21. deepest_invag_volume                                     -- Deepest invagination volume
#   22. deepest_invag_fraction_chull_volume                      -- Deepest invag: frac of convex hull volume
#   23. avg_normal_angle_adaptive_region_growth                  -- Deepest invag orientation
#   --- IFN-g perinuclear / invag enrichment (8) ---
#   24. IFNg_cyto_in_nuc_hull_MFI                                -- IFN-g invag MFI (0.5 um shell, inside hull)
#   25. IFNg_cyto_in_nuc_hull_sig_fraction                       -- IFN-g invag signal fraction
#   27. IFNg_cyto_in_nuc_hull_vs_near_convex_nuc_MFI_ratio       -- IFN-g invag vs near-convex nuclear MFI ratio
#   28. IFNg_cyto_in_nuc_hull_vs_all_perinuc_MFI_ratio           -- IFN-g invag vs all perinuclear MFI ratio
#   29. IFNg_invag_within_chull_vs_convex_within_chull_MFI_ratio -- IFN-g invag vs convex within hull MFI ratio
#   30. IFNg_invag_within_chull_vs_all_chull_MFI_ratio           -- IFN-g invag vs all hull MFI ratio
#   31. IFNg_frac_in_nuc_convex_hull                             -- IFN-g fraction inside nuclear convex hull
#   --- IFN-g deepest-invag ratios (4) ---
#   32. IFNg_ratio_by_deepest_invag_all_0_5um                    -- IFN-g levels near deepest invag (denom: all, 0.5 um)
#   33. IFNg_ratio_by_deepest_invag_all_1um                      -- IFN-g levels near deepest invag (denom: all, 1 um)
#   34. IFNg_ratio_by_deepest_invag_away_0_5um                   -- IFN-g levels near deepest invag (denom: away, 0.5 um)
#   35. IFNg_ratio_by_deepest_invag_away_1um                     -- IFN-g levels near deepest invag (denom: away, 1 um)

presentation: "K:/FF/PPT/PPT_autogeneration/IFNg/IFNg_template.pptx"
output_path: "K:/FF/PPT/PPT_autogeneration/IFNg/IFNg.pptx"
