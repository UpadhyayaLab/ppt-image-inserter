# Config: CTL Lamp1 grid plots
#
# Template slides (3 slides, 0-indexed):
#   0: 2-image comparison (stiffness, timecourse, and activation comparisons)
#   1: 1-image ~square panel (3SI_vs_4SI, 72hr_8p0)
#   2: 1-image wide panel (all_conditions, ratio ~3.3:1)
#
# Ordering: Metric -> Comparison type (259 slides: 37 metrics x 7 comparisons)
#
# Metrics (in order):
#   1. actin_deform_ratio -- Cell Aspect Ratio
#   2. nuc_aspect_ratio -- Nuclear aspect ratio
#   3. centrosome_from_MT_z_cell_bottom_distance -- Centrosome-synapse distance
#   4. actin_bottom_mask_area -- Synapse Area
#   5. actin_bottom_MFI -- Actin synapse MFI
#   6. actin_bottom_inner_outer_ratio -- Actin synapse inner/outer ratio
#   7. actin_bottom_circularity -- Synapse Circularity
#   8. Lamp1_peak_sig -- Lamp1 peak signal
#   9. Lamp1_total_sig -- Lamp1 total signal
#  10. Lamp1_synapse_MFI -- Lamp1 synapse MFI
#  11. Lamp1_synapse_MFI_3mip -- Lamp1 synapse MFI (3-MIP)
#  12. Lamp1_synapse_inner_outer_ratio -- Lamp1 synapse inner/outer ratio
#  13. Lamp1_synapse_inner_outer_ratio_3mip -- Lamp1 synapse inner/outer ratio (3-MIP)
#  14. Lamp1_z50_cell_bottom_distance -- Lamp1 z50 cell bottom distance
#  15. Lamp1_z50_cell_bottom_distance_norm_cell_height -- Lamp1 z50 cell bottom distance (norm. cell height)
#  16. Lamp1_synapse_total_sig -- Lamp1 synapse total signal
#  17. Lamp1_synapse_total_sig_3mip -- Lamp1 synapse total signal (3-MIP)
#  18. nuc_volume_mesh -- Nuclear volume
#  19. nuc_SA_mesh -- Nuclear surface area
#  20. chull_mean_D_cent_global_ratio -- Centrosomal Invagination Index
#  21. chull_max_D_by_cent -- Invag depth near centrosome
#  22. chull_max_D -- Max invag depth over full nucleus
#  23. deepest_invag_volume -- Deepest invagination volume
#  24. deepest_invag_fraction_chull_volume -- Deepest invag: frac of convex hull volume
#  25. nuc_solidity -- Nuclear solidity
#  26. avg_normal_angle_adaptive_region_growth_by_cent -- Invag Orientation
#  27. avg_normal_angle_by_cent -- Invag Orientation
#  28. avg_normal_angle_adaptive_region_growth -- Deepest Invag Orientation
#  29. Lamp1_enrichment_within_half_um_nuc_2_um_cent -- Lamp1 enrichment (peri-nuclear, 2 \u00b5m of cent)
#  30. Lamp1_MFI_around_cent_1um -- Lamp1 MFI around centrosome (1 \u00b5m)
#  31. Lamp1_MFI_around_cent_2um -- Lamp1 MFI around centrosome (2 \u00b5m)
#  32. Lamp1_MFI_around_cent_3um -- Lamp1 MFI around centrosome (3 \u00b5m)
#  33. Lamp1_frac_around_cent_1um -- Lamp1 fraction around centrosome (1 \u00b5m)
#  34. Lamp1_frac_around_cent_2um -- Lamp1 fraction around centrosome (2 \u00b5m)
#  35. Lamp1_frac_around_cent_3um -- Lamp1 fraction around centrosome (3 \u00b5m)
#  36. nuc_cent_closest_dist -- Nucleus-centrosome closest distance
#  37. centrosome_z_pos_rel_nucleus -- Centrosome z position relative to nucleus

presentation: "K:/FF/PPT/PPT_autogeneration/CTL_Reactivation_Assay/CTLReactivationAssay_template.pptx"
output_path: "K:/FF/PPT/PPT_autogeneration/CTL_Reactivation_Assay/CTLReactivationAssay_no_nuc_dist_filt.pptx"
