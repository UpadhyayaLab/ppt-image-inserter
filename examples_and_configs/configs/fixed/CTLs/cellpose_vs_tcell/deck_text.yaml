# Slide text for the naive 0708 deck "TCell mask vs Cellpose 3 nucleus segmentation" (methods slides, then two
# sheets per slide). Every line was proposed on 2026-11-24 from the method facts of the session "Compare TCell vs
# Cellpose nucleus segmentation"; NONE is approved yet (approved_text.yaml stays empty until FF's OK on the decision
# page). Previews: examples_and_configs/ctl_nucleus/cellpose_vs_tcell_decision_previews.py
# Each line is a bullet; a line with `sub` gets those lines as sub-bullets (FF 2026-11-24: "we need bullets. apply
# standard formatting, subbullets in sensible locations"). Slides are black (FF 2026-11-24: "use black bg").
methods:
  - title: "Nucleus segmentation: TCell mask vs Cellpose 3"
    lines:
      - "Reference: TCell watershed nucleus mask"
      - text: "Cellpose 3.1.1.2, cyto3 model, full 3D"
        sub:
          - "Diameter fixed at 60, 80, 100 or 150 px"
          - "Cell probability threshold 3.0"
          - "Intensity normalized to 1st–99th percentile, whole volume"
      - text: "Input: Hoechst channel, same cell crop as reference"
        sub:
          - "Sampling 0.065 x 0.065 x 0.3 μm, z resampled to 0.065 μm"
      - "Nucleus kept: label nearest crop center in xy"
      - "Cleanup same as reference: largest piece, holes filled, quality checks"
  - title: "Dataset and display"
    lines:
      - text: "Naive CTLs, H3K27ac, acquired 2024-07-08"
        sub:
          - "1,101 nuclei segmented per diameter"
          - "Shown: 32 nuclei, 4 per condition"
      - text: "Rows: reference, then Cellpose 60, 80, 100, 150 px"
        sub:
          - "Left: XY, XZ, YZ maximum projections"
          - "Right: XY, XZ, YZ center slices"
# Cell slides, two sheets per slide (FF 2026-11-24: "2 cells per slide I guess"): the slide title is the condition
# label (0708 config condition_labels), and each sheet has its cell number above it.
cell_title: "{condition}"
cell_label: "Cell {cell}"
