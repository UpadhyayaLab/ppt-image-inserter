# Config: CTL IFNg grid plots -- no nucleus
#
# Template slides (3 slides, 0-indexed):
#   0: 3-image comparison (used for both timepoint and stiffness comparisons)
#   1: PLL vs Glass (1 image)
#   2: All conditions (1 image)
#
# Ordering: Metric -> Comparison type (28 slides: 7 metrics x 4 comparisons)
#
# Metrics:
#   IFNg_peak_sig, IFNg_total_sig, IFNg_synapse_MFI, IFNg_synapse_MFI_3mip,
#   IFNg_synapse_inner_outer_ratio, IFNg_synapse_inner_outer_ratio_3mip,
#   IFNg_z50_cell_bottom_distance

