# Batch Image Replacement Configuration
# Combined across two experiments — no nucleus-based metrics

presentation: "K:/FF/PPT/PPT_autogeneration/Fixed Jurkats, Miscellaneous/Effects of CilioD, Fixed Cells_template.pptx"
output_path: "K:/FF/PPT/PPT_autogeneration/Fixed Jurkats, Miscellaneous/Effects of CilioD, Fixed Cells, Combined, no Nucleus.pptx"

# Template slide to copy (0-based index)
template_slide: 1
preserve_slides: [0, 1]

# Auto-detect position from the first image in the template slide
auto_position: true

label_side: left

# Base directory containing all images
base_dir: "J:/FF/vim_data/ciliobrevin-D/CilioD_combined/results_compilation/CilioD_combined_20260410/grid_panels"

