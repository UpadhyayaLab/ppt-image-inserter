# Batch Image Replacement Configuration
# Combined across two experiments — no nucleus-based metrics

presentation: "K:/FF/PPT/PPT_autogeneration/Fixed Jurkats, Miscellaneous/Effects of CilioD, Fixed Cells_template.pptx"
