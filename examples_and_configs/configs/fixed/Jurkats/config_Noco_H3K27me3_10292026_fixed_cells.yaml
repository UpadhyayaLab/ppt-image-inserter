# Exception: the two "at deepest invagination near centrosome" slides come from grid_panels/;
# the curated set has no by-centrosome copy of those panels.
# Figure review passed 2026-10-31 (TCell session), after the 05c0 label fix.
#
# Build:  python examples_and_configs/batch_insert_images.py <this file>

