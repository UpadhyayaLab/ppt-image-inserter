# Batch Image Replacement Configuration
# Noco 10/26/2026 fixed Jurkats — PLL DMSO / CD3 DMSO / CD3 Noco 5 μM / CD3 Noco 10 μM
# Stains: β-tubulin, phalloidin, eGFP-Centrin2, Hoechst. NO H3K27me3 despite the
# folder name (FF 2026-10-26).
#
# Summary deck (FF 2026-10-27: "look at the metrics we made for June ciliobrevin
# data ... the same ... but we need to expand on that with newer things like
# geom-density profiles"). Metric list, order and titles = config.report_extra
# in the pipeline's Jurkats_Noco_MT_20261026_compilation.m (the June CilioD
# interleaved deck's metrics, H3K27me3-near-invag -> DNA, H3K27me3 MFI dropped,
# then the MT block of config_Noco_MT.yaml) and the curated geom-density panels
# (MT_loc_wrto_invag\, DNA_loc_wrto_invag\). Order mirrors the visualization decks
# (FF 2026-10-27): drug effect, centrosome, invagination, shape, synapse, then
# MT and DNA relative to the invaginations. Dropped by FF: MT MFI in nuc hull,
# MT fraction in nuc hull, cell counts.
#
# Panels: <metric>_per_experiment_grid.png carry the brackets (Wilcoxon
# rank-sum, BH over the 4 declared pairs). One experiment; wells never pooled.
#
# Source compile: results_compilation_20261027, final (18:01): PLL 42, CD3 DMSO
# 39, 5 μM 31, 10 μM 40 cells; FF's 9 manual exclusions, mesh failures and the
# centrin filter (centrosome_max_signal > 50) applied; 12 flagged cells kept.

presentation: "K:/FF/PPT/PPT_autogeneration/Fixed Jurkats, Miscellaneous/Noco/Effects of Noco, Fixed Cells_MT_template.pptx"
output_path: "K:/FF/PPT/PPT_autogeneration/Fixed Jurkats, Miscellaneous/Noco/Effects of Noco, MT, 10262026.pptx"

# Template slide to copy (0-based index)
template_slide: 1
preserve_slides: [0, 1]

# Auto-detect position from the first image in the template slide
auto_position: true

label_side: left
add_label: false          # no source file name at the bottom of slides (FF 2026-10-27)

# Base directory for the metric panels; geom-density panels use absolute paths.
base_dir: "L:/FF/Nucleus_centrosome/nocodazole_fixed/10262026_jurkats_noco_h3k27me3640LP35_p549LP45_egfpcentrin2488LP45_h405LP40_/results_compilation_20261027/grid_panels"

