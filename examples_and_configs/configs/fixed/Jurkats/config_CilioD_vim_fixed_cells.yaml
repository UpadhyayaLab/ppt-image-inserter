# Batch Image Replacement Configuration
# This YAML file specifies which images to insert into PowerPoint slides

presentation: "K:/FF/PPT/PPT_autogeneration/Fixed Jurkats, Miscellaneous/Effects of CilioD, Fixed Cells_template.pptx"
output_path: "K:/FF/PPT/PPT_autogeneration/Fixed Jurkats, Miscellaneous/Effects of CilioD, Fixed Cells.pptx"

# Template slide to copy (0-based index)
template_slide: 1
preserve_slides: [0, 1]

# Auto-detect position from the first image in the template slide
auto_position: true

label_side: left

# Base directory containing all images
base_dir: "J:/FF/vim_data/ciliobrevin-D/20230604_MAC_CilioD/results_compilation/CilioD_20230604_7min_12min_20260410/grid_panels"

