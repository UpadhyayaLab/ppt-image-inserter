# Batch Image Replacement Configuration
# Noco 10/26/2026 fixed Jurkats: the depth / curvature / coupling results, one plot per
# slide, plots re-rendered without their in-figure title (no date, no "segmentation
# artifacts excluded"). FF 2026-10-28: "make new versions of the results slides (this is
# in addition not replacing) without any titles like segmentation artifacts excluded or
# dates". Then paired (FF 2026-10-28, via the TCell session): each all-cells slide, then
# its twin with the 10 segmentation-artifact nuclei left out; slide subtitle
# "All cells" / "Artifacts excluded" (label on the slide, not in the plot).
# The full summary deck (config_Noco_MT_10262026_fixed_cells.yaml) is unchanged.
#
# Plots: TCell session re-render into noco_bycent_plots\<folder>_all_cells_notitle\ and
# <folder>_artifacts_excluded_notitle\, same file names in both.
# Slide titles = the summary deck's.

