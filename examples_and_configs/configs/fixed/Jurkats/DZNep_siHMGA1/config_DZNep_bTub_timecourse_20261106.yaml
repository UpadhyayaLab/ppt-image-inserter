# Batch Image Replacement Configuration
# DZNep bTub timecourse, Jurkats, one experiment (Feb 3, 2026): H2O (Ctrl) vs DZNep at 4/8/15/30/60 min.
# Compiled 2026-11-06 by the "bTub 1 hr" session. Figures have NOT been through figure-reviewer, and the
# compile's legibility pass flagged text overlap/clipping in 497 figures.
# Order: cell counts, then the curated MT_loc_wrto_invag set in file-number order with the DNA figure of the
# same number beside it (Left: microtubules, Right: DNA). 06b (orientation ratios) exists for MT only.
# 07 (nuclear shape) and 09a (cell counts) are byte-identical in the MT and DNA folders, so they appear once.
# Subtitles are shortened from MT_loc_wrto_invag/README.txt.
# grid_panels/: 9 metrics picked by the "bTub 1 hr" session, per-timepoint then timecourse slides. QC meshes left
# out (the HTML report builder that copies them has not been run).
#
# Build:  python examples_and_configs/batch_insert_images.py <this file>

presentation: "K:/FF/PPT/PPT_autogeneration/Fixed Jurkats, Miscellaneous/Noco/Effects of Noco, Fixed Cells_MT_template.pptx"
output_path: "K:/FF/PPT/PPT_autogeneration/Fixed Jurkats, Miscellaneous/DZNep_siHMGA1/DZNep_bTub_timecourse_20261106.pptx"

template_slide: 1
backup_dir: "K:/FF/PPT/PPT_autogeneration/Fixed Jurkats, Miscellaneous/DZNep_siHMGA1/backups"
preserve_slides: [0, 1]
title_slide_text: "DZNep βTub timecourse, Feb 3, 2026 (not yet reviewed)"

auto_position: false
position: {left: 0.3, top: 1.17, width: 12.73, height: 6.15}
trim_whitespace: true
title_fit: true

label_side: left
add_label: false
remove_template_slide: true

# Every image path below is relative to this folder.
base_dir: "J:/FF/Nucleus_Project_up_to_1hr/020302026_jurkats_dznep_lmnB1orbTub_561LP55_488LP45_405LP40_/results_compilation/DZNep_bTub_timecourse_20260203_20261106"

images:
  # --- Cell counts ---
  - path: "MT_loc_wrto_invag/09a_cell_counts_filter_breakdown.tiff"
    title: "Cells kept after each filter"
    subtitle: "Final n, 4/8/15/30/60 min: Ctrl 74/66/74/63/68, DZNep 82/71/46/57/67. Figures not yet reviewed; 497 flagged for text overlap."

  # --- 02: signal vs geometry, Mean ± SEM across cells ---
  - images: ["MT_loc_wrto_invag/02a_MT_avg_hulldist.tiff", "DNA_loc_wrto_invag/02a_DNA_avg_hulldist.tiff"]
    positions: &pair
      - {left: 0.3, top: 1.95, width: 6.25, height: 5.45}
      - {left: 6.78, top: 1.95, width: 6.25, height: 5.45}
    title: "Signal vs distance to the convex-hull boundary"
    subtitle: "Perinuclear shell. Left: microtubules. Right: DNA."
  - images: ["MT_loc_wrto_invag/02b_MT_avg_minCurvature.tiff", "DNA_loc_wrto_invag/02b_DNA_avg_minCurvature.tiff"]
    positions: *pair
    title: "Signal vs min curvature"
    subtitle: "Left: microtubules. Right: DNA."
  - images: ["MT_loc_wrto_invag/02c_MT_avg_meanCurvature.tiff", "DNA_loc_wrto_invag/02c_DNA_avg_meanCurvature.tiff"]
    positions: *pair
    title: "Signal vs mean curvature"
    subtitle: "Left: microtubules. Right: DNA."

  # --- 03: per-cell enrichment (region / cell mean; > 1 = enriched) ---
  - images: ["MT_loc_wrto_invag/03a_MT_enrichment_hulldist_gt0.5um.png", "DNA_loc_wrto_invag/03a_DNA_enrichment_hulldist_gt0.5um.png"]
    positions: *pair
    title: "Enrichment in invaginations deeper than 0.5 μm"
    subtitle: "One dot per cell; > 1 = enriched. Left: microtubules. Right: DNA."
  - images: ["MT_loc_wrto_invag/03b_MT_enrichment_hulldist_gt1.0um.png", "DNA_loc_wrto_invag/03b_DNA_enrichment_hulldist_gt1.0um.png"]
    positions: *pair
    title: "Enrichment in invaginations deeper than 1.0 μm"
    subtitle: "One dot per cell; > 1 = enriched. Left: microtubules. Right: DNA."
  - images: ["MT_loc_wrto_invag/03c_MT_enrichment_minCurvature_lt0.png", "DNA_loc_wrto_invag/03c_DNA_enrichment_minCurvature_lt0.png"]
    positions: *pair
    title: "Enrichment on concave surface (min curvature < 0)"
    subtitle: "One dot per cell; > 1 = enriched. Left: microtubules. Right: DNA."
  - images: ["MT_loc_wrto_invag/03d_MT_enrichment_minCurvature_ltm0.25.png", "DNA_loc_wrto_invag/03d_DNA_enrichment_minCurvature_ltm0.25.png"]
    positions: *pair
    title: "Enrichment on strongly concave surface (min curvature < −0.25)"
    subtitle: "One dot per cell; > 1 = enriched. Left: microtubules. Right: DNA."
  - images: ["MT_loc_wrto_invag/03e_MT_enrichment_meanCurvature.png", "DNA_loc_wrto_invag/03e_DNA_enrichment_meanCurvature.png"]
    positions: *pair
    title: "Enrichment on concave surface (mean curvature < 0)"
    subtitle: "One dot per cell; > 1 = enriched. Left: microtubules. Right: DNA."

  # --- 04: per-cell Pearson r ---
  - images: ["MT_loc_wrto_invag/04a_MT_correlation_hulldist.png", "DNA_loc_wrto_invag/04a_DNA_correlation_hulldist.png"]
    positions: *pair
    title: "Per-cell correlation with distance to the hull boundary"
    subtitle: "Area-weighted Pearson r, one dot per cell. Left: microtubules. Right: DNA."
  - images: ["MT_loc_wrto_invag/04b_MT_correlation_minCurvature.png", "DNA_loc_wrto_invag/04b_DNA_correlation_minCurvature.png"]
