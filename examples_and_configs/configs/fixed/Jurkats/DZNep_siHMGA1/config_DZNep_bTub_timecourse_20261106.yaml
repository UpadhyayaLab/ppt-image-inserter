  - images: ["MT_loc_wrto_invag/04c_MT_correlation_meanCurvature.png", "DNA_loc_wrto_invag/04c_DNA_correlation_meanCurvature.png"]
    positions: *pair
    title: "Per-cell correlation with mean curvature"
    subtitle: "Below 0 = enriched on concave surface. Left: microtubules. Right: DNA."

