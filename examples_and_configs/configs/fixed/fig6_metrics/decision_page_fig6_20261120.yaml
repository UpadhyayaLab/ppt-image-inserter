  - number: "4"
    title: "Slides 3–4: what they show and their title"
    source: "geom_density_seed_disk_metrics.m:24-27 (the 50% magenta disk is the centrosome-proximal region)"
    blocks:
      - p: "They show disks at 10 / 25 / 50% of the mean surface distance around two points: the nadir of the centrosome-proximal region (purple, top) and the centrosome projection (magenta, bottom). The 25% purple disk is the near-centrosome violins' region. The whole-nucleus region and the whole-nucleus nadir do not appear. The subtitle \"Cyan = away. Bars = 5 μm.\" is accurate."
      - now: {text: "The regions measured, CD3 DMSO cell 10", where: "slide 3 title (slide 4: cell 34)"}
      - slides:
          - {id: deck_03, png: deck_03.png, caption: "Slide 3 now"}
          - {id: deck_04, png: deck_04.png, caption: "Slide 4 now"}
      - decision:
