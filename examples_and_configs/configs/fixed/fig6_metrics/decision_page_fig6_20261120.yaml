# Fig 6 deck decision page, built by examples_and_configs/decision_page/build_decision_page.py
# Published at https://claude.ai/artifact/7jNQXaAqQa3t7bCk8qpiUS (capabilities {db: {}}; answers in collection "decisions").
# Item and option wording: verbatim from the Histone mark data session's code-checked reply (2026-11-19), as on the
# first version of the page. Slides: examples_and_configs/fig6_metrics/render_decision_previews.py.
title: "Fig 6 Deck Decisions"
heading: "Fig 6 deck: decisions"
lead: "Each option shows its full slide, built by the deck's own pipeline. Click your pick for each decision, or write a change and click Save change. Under every slide here, Change this slide opens its text to edit and save. Each save is kept at once, and you can change it any time. Click any slide to enlarge it. Every slide shows its title at the deck's fixed 36 pt; the line under each slide says how many lines that title takes, measured in PowerPoint, and red marks a title whose letters run into the figure. Slide numbers assume the new near-centrosome slides at 11–13 and 35–37. Every slide shows your saved answers so far; items they settle show one line each. Every proposed string is copied from Histone mark data's code-checked replies. Nothing goes on a slide until you pick; the build refuses any slide text not on your approved list."
collection: decisions
png_dir: "K:/FF/PPT/PPT_autogeneration/Fig6_metrics_across_experiments/decision_previews/named"
png_width: 1280
slide_text: slide_text.json          # per-slide text for the change boxes, written by render_decision_previews.py
slide_facts: slide_facts.json        # measured title lines per slide (measure_title_lines.py), shown under each slide
# Latest saved state is the base for every slide (FF 2026-11-19: "then why is this showing old slide????"). Export the
# db right before each build: ArtifactData list, collections slides and decisions, out_dir = saved_state.dir.
saved_state:
  dir: "K:/FF/PPT/PPT_autogeneration/Fig6_metrics_across_experiments/decision_previews/db_export"
  rebuilt:                              # slide id with a saved change -> slide rendered from it
    contents_base: deck_02.png          # FF's saved slide 2 text, rendered by the deck's own renderer
    cent_violin_1A_noco_oct: deck_13.png   # deck slide 13: title with FF's 11a pick at the fixed 36 pt (his font note ruled by that)
# One plain line shown with a slide's saved change (Histone mark data agent presentation's ruling, 2026-11-19)
saved_change_notes:
  cent_violin_1A_noco_oct: "Font: fixed 36 pt for all titles (your later instruction)"
# The default view: every deck slide in order (render_decision_previews.py --from full writes the index and PNGs).
all_slides:
  index: deck_slides.json
  png_width: 1100
  heading: "Fig 6 deck: all slides"
  lead: "Every slide of the deck in deck order, with your answers so far: slide 2 shows the Contents text you saved, slides 11–13 are the new near-centrosome violins titled with your 11a pick, and slides 35–37 are the new near-centrosome profiles titled with your pick 2A. Every other slide has the deck's current image and title. Each slide's text is open below it: edit any line and click Save slide change. Click a slide to enlarge it. The line under each slide gives its title's line count at the deck's fixed 36 pt, measured in PowerPoint; red marks a title of 3 or more lines or one whose letters run into the figure. The other decisions are one click away, under Decisions at the top."
  captions:
    contents_base: "Contents, with the change you saved"
    deck_11: "New: near-centrosome violins, title with your 11a pick"
    deck_12: "New: near-centrosome violins, title with your 11a pick"
    cent_violin_1A_noco_oct: "New: near-centrosome violins, title with your 11a pick"
    deck_35: "New: near-centrosome profiles, title with your pick 2A"
    deck_36: "New: near-centrosome profiles, title with your pick 2A"
    deck_37: "New: near-centrosome profiles, title with your pick 2A"

