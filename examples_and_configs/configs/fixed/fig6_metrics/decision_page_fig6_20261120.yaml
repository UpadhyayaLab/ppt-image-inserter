# Fig 6 deck decision page. Published at https://claude.ai/artifact/7jNQXaAqQa3t7bCk8qpiUS (capabilities {db: {}}).
# Steps (decision_page/README.md): apply_answers.py -> fig6_metrics/fig6_decision_previews.py -> build_decision_page.py.
# Option wording: verbatim from the Histone mark data session's code-checked replies (2026-11-19); `source` per item is
# for the record and not shown. An option with `replace` is previewed and applied automatically (whole lines only,
# decision_page/text_map.py); an option with `request` needs work by its owner and shows the current slides.
title: "Fig 6 Deck Decisions"
heading: "Fig 6 deck: decisions"
lead: "Open decisions first, resolved ones after them. Each option shows every slide it changes, built by the deck's own pipeline from the deck as it now is. Click your pick, or write a change and click Save change; each save is kept at once and can be changed any time. Click a resolved line to open it again. Every proposed string is copied from Histone mark data's code-checked replies."
all_heading: "Fig 6 deck: all slides"
all_lead: "Every slide of the deck as it now is, with your answers so far applied. Edit any line in the box under a slide and click Save slide change. Click a slide to enlarge it. The line under each slide gives its title's line count at the deck's fixed 36 pt, measured in PowerPoint; red marks 3 or more lines or a title whose letters run into the figure."
collection: decisions
slide_collection: slides
deck:
  config: config_fig6_metrics_by_metric_20261118.yaml
  text: ../../../fig6_metrics/deck_text.yaml
  approved: ../../../fig6_metrics/approved_text.yaml
applied: decision_page_fig6_applied.yaml
db_export: "K:/FF/PPT/PPT_autogeneration/Fig6_metrics_across_experiments/decision_previews/db_export"   # ArtifactData list out_dir; refreshed before each build
page_data: "K:/FF/PPT/PPT_autogeneration/Fig6_metrics_across_experiments/decision_previews/page/page_data.json"
png_width: 1100

items:
  - code: "4"
    title: "Slides 3–4: what they show and their title"
    source: "geom_density_seed_disk_metrics.m:24-27 (the 50% magenta disk is the centrosome-proximal region)"
    about: "They show disks at 10 / 25 / 50% of the mean surface distance around two points: the nadir of the centrosome-proximal region (purple, top) and the centrosome projection (magenta, bottom). The 25% purple disk is the near-centrosome violins' region. The whole-nucleus region and the whole-nucleus nadir do not appear. The subtitle \"Cyan = away. Bars = 5 μm.\" is accurate."
    options:
      - choice: "4A"
        text: "Regions around the nadir of the centrosome-proximal region and the centrosome projection, CD3 DMSO cell 10"
        note: "Retitle only (slide 4: cell 34)."
        note_source: "Histone mark data, 2026-11-19"
        replace:
          - {old: "The regions measured, CD3 DMSO cell 10", new: "Regions around the nadir of the centrosome-proximal region and the centrosome projection, CD3 DMSO cell 10", where: titles}
          - {old: "The regions measured, CD3 DMSO cell 34", new: "Regions around the nadir of the centrosome-proximal region and the centrosome projection, CD3 DMSO cell 34", where: titles}
          - {old: "The regions measured", new: "Regions around the nadir of the centrosome-proximal region and the centrosome projection", where: titles}   # the contents row follows the titles (not shown)
      - choice: "4B"
        label: "Retitle as 4A, and add a picture of the whole-nucleus region (its title would come later)"
        request: "Histone mark data"

  - code: "5a"
    title: "Violin y label inside the near-centrosome figures"
    source: "generate_geom_density_seed_depth_study.m:240-244 (local_around_label)"
    about: 'In this deck "near Nadir" means the half-depth region; this value is a disk.'
    current: "Rel. Level near Nadir"
    slides: [Ccent_cilio_jun_0, Ccent_cilio_oct_0, Ccent_noco_oct_0]
    options:
      - choice: "5a-B"
        text: "Rel. Level around Region Nadir"
        note: "The seed study's own label."
        note_source: "Histone mark data, 2026-11-19"
        request: "Histone mark data"

  - code: "5b"
    title: "Profile y label inside the figures"
    source: "generate_geom_density_seed_depth_study.m:240-244"
    about: "Accurate, but it names no reference and differs from the slides' \"Relative level\". Changing it means relabeling the whole-nucleus and near-centrosome profiles and the depth profiles; the data session gave no exact text. The x label \"Geodesic Dist. from Region Nadir\" is accurate for both profile types (no decision needed)."
    current: "Relative Density"
    slides: [Dcent_noco_oct_0, D_noco_oct_0]
    options:
      - choice: "5b-B"
        label: "Relabel to match the slides (data session proposes exact text first)"
        request: "Histone mark data"

  - code: "7"
    title: "Table key, main"
    source: "inperinuc_shell_face_density.m:42-43 (as 3a)"
    options:
      - choice: "use"
        button: "Use this"
        text: "Mean in the 0.25 μm layer near the nadir, weighted by surface area, ÷ the same over the whole nuclear surface (1 = no enrichment); mean ± SEM over cells"
        note: "Exact (adds the weighting, as 3a)."
        note_source: "Histone mark data, 2026-11-19"
        replace:
          - {old: "Mean in the 0.25 μm layer near the nadir ÷ the same layer, whole nucleus (1 = no enrichment); mean ± SEM over cells", new: "Mean in the 0.25 μm layer near the nadir, weighted by surface area, ÷ the same over the whole nuclear surface (1 = no enrichment); mean ± SEM over cells", where: lines}

  - code: "8a"
    title: "Separate image-based deck (the 44 slides moved out): title pattern"
    source: "nuc_signal_by_invag.m:194-214, :321-340"
    keep: false
    options:
      - choice: "use"
        button: "Use this"
        text: "Relative <channel> intensity near the deepest invagination: ..."
        note: '"near", not "in": the numerator also takes the 0.25 μm layer inside the nuclear surface.'
        note_source: "Histone mark data, 2026-11-19"
        not_rendered: "Not rendered: the image-based deck is not built yet."

  - code: "8b"
    title: "Separate image-based deck: definition line for its title slide"
    source: "nuc_signal_by_invag.m:194-214; subtract_bg = 0 at process_nucleus_channel.m:775"
    keep: false
    options:
      - choice: "use"
        button: "Use this"
        text: "Mean intensity of nuclear voxels within 0.25 μm of the deepest invagination (surface voxels deeper than half the maximum depth below the convex hull, connected to the deepest one) ÷ mean intensity within 0.25 μm of the whole nuclear surface; voxels, no background subtraction"
        note: 'It says "voxels" (you said not to mention voxels); it needs rewording by you or the data session.'
        note_source: "Histone mark data, 2026-11-19"
        not_rendered: "Not rendered: the image-based deck is not built yet."

  - code: "9"
    title: "New near-centrosome figures: reviewer's notes"
    source: "figure-reviewer notes relayed by Histone mark data, 2026-11-19"
    about:
      - "Y ticks: nocodazole Oct 29 and ciliobrevin Jun profiles every 0.2; ciliobrevin Oct 29 profile and the deck's whole-nucleus nocodazole Oct 29 profile every 0.1 (the deck's other profiles vary)."
      - 'The nocodazole Oct 29 5μM legend entry reads "n=52, 51-52 per bin".'
      - "Violin y ranges differ per experiment (each autoscaled, as the deck's violins are)."
    keep_label: "Keep as is"
    slides: [Dcent_cilio_jun_0, Dcent_cilio_oct_0, Dcent_noco_oct_0, D_noco_oct_0, Ccent_cilio_jun_0, Ccent_cilio_oct_0, Ccent_noco_oct_0]
    options:
      - choice: "9B"
        label: "Ask Histone mark data to match the ticks and legend to the deck's profiles"
        request: "Histone mark data"

  - code: "11b"
    title: "Near-centrosome profile titles"
    source: "Histone mark data's code-checked reply relayed 2026-11-19"
    options:
      - choice: "use"
        button: "Use this"
        text: "Relative level vs distance from the centrosome-proximal nadir"
        note: "Histone mark data: accurate."
        note_source: "Histone mark data, 2026-11-19"
        replace:
          - {old: "Relative level vs distance from the nadir of the centrosome-proximal region", new: "Relative level vs distance from the centrosome-proximal nadir", where: titles}

  - code: "11c"
    title: "DMSO vs ciliobrevin date, on every slide of that experiment"
    source: "Histone mark data's code-checked reply relayed 2026-11-19"
    about: "Only the depth panels say N1 (Jun 12) and N2 (Jun 13). The whole-nucleus violin and profile labels and the near-centrosome labels say N1 and N2 without dates, so on those slides the title is the only place that ties N1 to Jun 12."
    options:
      - choice: "use"
        button: "Use this"
        text: "Jurkat H3K27me3, DMSO vs ciliobrevin (Jun 12 and 13, 2026)"
        replace:
          - {old: "Jurkat H3K27me3, DMSO vs ciliobrevin (N1 Jun 12, N2 Jun 13, 2026)", new: "Jurkat H3K27me3, DMSO vs ciliobrevin (Jun 12 and 13, 2026)", where: titles}

  - code: "12a"
    title: 'Slide 2 "Nadir" row'
    source: "Histone mark data's code check of FF's saved slide 2, relayed 2026-11-19"
    options:
      - choice: "use"
        button: "Use this"
        text: "Nadir: surface point farthest from the hull boundary (centrosome-proximal: within that region)"
        note: "The centrosome-proximal nadir is the farthest point within that region only."
        note_source: "Histone mark data, 2026-11-19"
        replace:
          - {old: "Nadir: surface point farthest from the hull boundary", new: "Nadir: surface point farthest from the hull boundary (centrosome-proximal: within that region)", where: lines}

  - code: "12b"
    title: 'Slide 2 "Level" note'
    source: "Histone mark data's code check of FF's saved slide 2, relayed 2026-11-19"
    options:
      - choice: "use"
        button: "Use this"
        text: "Level: mean in the 0.25 μm layer inside the nuclear surface ÷ the area-weighted mean over the whole surface"
        note: "Value and reference are both area-weighted means over the surface, not plain layer means."
        note_source: "Histone mark data, 2026-11-19"
        replace:
          - {old: "Level: mean in the 0.25 μm layer inside the nuclear surface ÷ mean in that layer over the whole nucleus", new: "Level: mean in the 0.25 μm layer inside the nuclear surface ÷ the area-weighted mean over the whole surface", where: lines}

  - code: "12c"
    title: "Slide 2: one term for the whole nucleus"
    source: "Histone mark data's code check of FF's saved slide 2, relayed 2026-11-19"
    about: 'Rows say "full nucleus"; the notes and table headers say "whole nucleus".'
    options:
      - choice: "use"
        button: "Use this"
        label: '"whole nucleus" everywhere'
        note: "Two words for one idea."
        note_source: "Histone mark data, 2026-11-19"
        replace:
          - {old: "Relative level near nadir (full nucleus; no centrosome consideration)", new: "Relative level near nadir (whole nucleus; no centrosome consideration)", where: lines}
          - {old: "Relative level vs distance from nadir (full nucleus; no centrosome consideration), along the surface", new: "Relative level vs distance from nadir (whole nucleus; no centrosome consideration), along the surface", where: lines}

  - code: "12d"
    title: "Slide 2 row for the near-centrosome profiles"
    source: "Histone mark data's code check of FF's saved slide 2, relayed 2026-11-19"
    options:
      - choice: "use"
        button: "Use this"
        text: "Relative level vs distance from the centrosome-proximal nadir, along the surface"
        note: 'One name for the centrosome point (as in row 11–13), and "along the surface" as in row 38–58; the distances are the same kind.'
        note_source: "Histone mark data, 2026-11-19"
        replace:
          - {old: "Relative level vs distance from the nadir of the centrosome-proximal region", new: "Relative level vs distance from the centrosome-proximal nadir, along the surface", where: lines}

  - code: "seen"
    title: "Seen while building the text check (no action proposed)"
    about:
      - 'Table rows write two-date experiments as "(N1 Aug 3, 2023; N2 Sep 11, 2023)"; slide titles as "(N1 Aug 3, N2 Sep 11, 2023)".'
      - 'One arm in the Naive CTL RNAP II table is labeled "1-16".'
