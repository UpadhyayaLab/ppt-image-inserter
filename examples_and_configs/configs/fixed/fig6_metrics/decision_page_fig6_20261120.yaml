    blocks:
      - settled:
          text: "Settled by your slide 2 text: “11–13 Relative level near the centrosome-proximal nadir”"
          slides: [{id: contents_base, png: deck_02.png, caption: "Slide 2 with the text you saved"}]

  - number: "2"
