      - "1 h: IFNG transcription starts (2 % of cells); mature IFNG mRNA shifts to the cytoplasm"
      - "3 h: IFNG transcription sites peak (8 % of cells)"
      - "Protein peaks: IFN-γ at 2 h, TNF at 2 to 3 h"
    caption: "Lattanzio et al., EMBO J 2025, Results"

