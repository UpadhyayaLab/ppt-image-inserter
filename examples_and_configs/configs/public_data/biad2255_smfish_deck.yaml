    title: "Effector CD8 T cells: activated once, then rested 7 days"
    bullets:
      - "Blood from 3 healthy donors; CD8 T cells enriched to > 85 % purity"
      - "First activation: 72 h, plate-bound anti-CD3 + soluble anti-CD28"
      - "Then 7 days in culture with IL-2: effector T cells (Teff), primed for a fast recall response"
    caption: "Lattanzio et al., EMBO J 2025, Methods"

  - kind: text
    draft: true
    title: "Restimulation: soluble anti-CD3 + anti-CD28, then fixed"
    bullets:
      - "0 h: resting Teff, not restimulated"
      - "1 to 6 h: soluble anti-CD3 + anti-CD28 (1 μg/mL each) in culture medium"
      - "Then 20 min at 37 °C on Alcian blue-coated coverslips, fixed in 4 % PFA"
      - "Soluble antibodies, no target cells: no immune synapse"
    caption: "Lattanzio et al., EMBO J 2025, Methods · the paper does not say whether cells were kept in suspension"

  - kind: text
    draft: true
    title: "smFISH: each mRNA molecule is one spot"
    bullets:
