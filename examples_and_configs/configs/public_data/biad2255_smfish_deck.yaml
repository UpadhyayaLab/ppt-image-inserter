      - "Many dyes on one mRNA make one bright spot; FISH-quant fits each spot in 3D"
      - "Red dyes (IFNG: CAL Fluor Red 610, TNF: Quasar 670) avoid granule autofluorescence"
      - "Transcription site (nascent RNA): nuclear spot ≥ 1.5× one mRNA"
    caption: "Lattanzio et al., EMBO J 2025, Methods · Stellaris probes (LGC Biosearch)"

  - kind: text
    draft: true
    title: "Time points: resting (0 h) to 6 h restimulated"
    bullets:
